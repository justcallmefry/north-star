# Run lint and build on push and pull requests.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          # Prisma generate runs in postinstall; use dummy URLs for CI
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"

      # Lint skipped: Next 16 removed "next lint"; migrate to ESLint flat config to re-enable.
      - name: Typecheck
        run: npm run typecheck

      - name: Build shared
        run: npm run build -w @north-star/shared

      # Run next build directly — skip prisma migrate deploy (no live DB in CI)
      - name: Build aligned
        run: npx cross-env NEXT_PUBLIC_BUILD_PHASE=phase-production-build next build
        working-directory: apps/aligned
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
          NEXT_PUBLIC_APP_URL: "https://alignedconnectingcouples.com"
