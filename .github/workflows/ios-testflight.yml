# Build Aligned for iOS and upload to TestFlight — no local Mac needed.
# Trigger manually (Actions tab → "Run workflow") or by pushing an `ios-v*` tag.
name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

# Only one iOS build at a time so build numbers can't collide.
concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          # Prisma's postinstall needs a URL shape; never connects in CI.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"

      - name: Sync Capacitor iOS project
        # Writes capacitor.config.json + copies web assets into the native shell.
        # The app loads the live site via server.url, so this is mostly config.
        run: npx cap sync ios

      - name: Clear inherited signing identity
        # project.pbxproj pins CODE_SIGN_IDENTITY = "iPhone Developer" at the
        # project level and the App target inherits it, so automatic signing
        # hunts for a *development* provisioning profile when archiving —
        # which requires a registered device that no CI runner has. Cleared
        # here (deterministic cwd, unlike inside a fastlane lane) so Xcode
        # selects a distribution identity on its own.
        run: |
          sed -i '' '/CODE_SIGN_IDENTITY/d' ios/App/App.xcodeproj/project.pbxproj
          echo "remaining CODE_SIGN_IDENTITY lines: $(grep -c CODE_SIGN_IDENTITY ios/App/App.xcodeproj/project.pbxproj || true)"

      - name: Select the newest installed Xcode
        # Capacitor 8 needs Xcode 16+. Pinned to 15.4, capacitor-swift-pm
        # fails to build and every plugin then reports missing Capacitor
        # symbols ("CAPPluginCall has no member reject") — cascade errors
        # from a module that never compiled, not real API mismatches.
        # Chosen dynamically so runner image updates can't re-pin us to a
        # stale toolchain.
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -switch "$latest"
          xcodebuild -version
          swift --version

      - name: Build & upload to TestFlight
        run: fastlane beta # fastlane is preinstalled on GitHub macOS runners
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Optional: a distribution certificate to reuse. Without it the
          # lane creates one, and Apple only allows two.
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_P12_PASSWORD: ${{ secrets.DIST_CERT_P12_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Publish the distribution certificate for reuse
        # Only produced when the lane had to create a certificate. Download
        # it, base64 it, store it as the DIST_CERT_P12_BASE64 secret, then
        # delete this artifact — after that every run reuses one identity
        # and Apple's two-certificate limit stops being a problem.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-certificate
          path: fastlane/certs/*.p12
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build/
            ~/Library/Logs/gym/
          if-no-files-found: ignore
          retention-days: 5
